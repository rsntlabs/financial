name = "financials-provider-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# Runs this Worker near the upstream (Yahoo/SEC) instead of near the request,
# since every request is outbound-bound rather than compute-bound.
[placement]
mode = "smart"

# Set with: wrangler secret put SEC_USER_AGENT
# Value: "YourApp/1.0 your-real-contact@example.org" (SEC EDGAR fair-access policy).

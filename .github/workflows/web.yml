name: Web, WASM and GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A repository variable (not a secret) set to the deployed Cloudflare Worker's
  # origin once it exists. The .invalid placeholder never resolves, so a build
  # before that variable is set fails acquisition obviously rather than quietly
  # pointing at the wrong host. See worker/README and docs/providers.md.
  VITE_PROVIDER_PROXY_URL: ${{ vars.PROVIDER_PROXY_URL || 'https://financials-proxy.invalid' }}

jobs:
  verify:
    concurrency:
      group: "verify-${{ github.workflow }}-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        id: pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Select site base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          IS_PAGES_BUILD: ${{ steps.pages.outcome == 'success' }}
        run: |
          if [ "$IS_PAGES_BUILD" = "true" ]; then
            echo "BASE_PATH=${PAGES_BASE_PATH}/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/financials/" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p financial-providers --lib --target wasm32-unknown-unknown --locked -- -D warnings
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Upload Pages site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: verify
    concurrency:
      group: "pages-${{ github.ref }}"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  worker:
    name: Cloudflare Worker
    concurrency:
      group: "worker-${{ github.workflow }}-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy-worker:
    # Requires repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
    # and SEC_USER_AGENT (see worker/README). The `secrets` context is not
    # readable in any `if:` condition, job- or step-level (GitHub rejects the
    # whole workflow file if it is referenced there), so it is captured into
    # a job-level env var first; each step branches on that instead, and
    # no-ops until the secrets exist rather than failing the job.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: worker
    concurrency:
      group: "worker-deploy-${{ github.ref }}"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
      - name: Deploy Cloudflare Worker
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            SEC_USER_AGENT
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
